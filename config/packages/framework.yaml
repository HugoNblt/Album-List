# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
        # Spotify simulé : aucune requête réseau pendant les tests
        http_client:
            mock_response_factory: App\Tests\Mock\SpotifyMockResponseFactory
        # Pas d'appel au service Have I Been Pwned pendant les tests
        validation:
            not_compromised_password: false
        # Compteurs des rate limiters : cache fichier dédié, vidé au début de chaque test (AppWebTestCase)
        cache:
            pools:
                cache.rate_limiter:
                    adapter: cache.adapter.filesystem
